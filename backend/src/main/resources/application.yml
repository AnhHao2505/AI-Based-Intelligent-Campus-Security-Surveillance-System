spring:
  application:
    name: campus-security-backend
  jackson:
    time-zone: Asia/Ho_Chi_Minh
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:campus_security}?options=-c%20timezone=Asia/Ho_Chi_Minh
    username: ${POSTGRES_USER:sep}
    password: ${POSTGRES_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false # Tránh LazyInitializationException bị che giấu / query N+1 không kiểm soát
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    out-of-order: true
    locations: classpath:db/migration

  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # Cấu hình Multipart Upload (cho phép upload file ZIP dataset lên tới 500MB)
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 510MB

  # Apache Kafka Configuration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: campus-security-backend-group
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        spring.json.trusted.packages: "*"

# Actuator — health check, Phase 1 Definition of Done: GET /actuator/health -> 200 OK
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    mail:
      enabled: false # Tắt mail health check để tránh 503 khi chưa có tài khoản SMTP thật

server:
  port: 8080

# Cấu hình kết nối sang AI Microservice
ai:
  service:
    url: http://${AI_SERVICE_HOST:localhost}:${AI_SERVICE_PORT:8000}

# Cấu hình kết nối MediaMTX Gateway (Port 9997 API)
mediamtx:
  api:
    url: http://${MEDIAMTX_HOST:localhost}:${MEDIAMTX_API_PORT:9997}

camera:
  rtsp:
    timeout-ms: ${CAMERA_RTSP_TIMEOUT_MS:3000}

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION:86400000} # 24 hours
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  # Cấu hình triển khai (không phải tham số nghiệp vụ): địa chỉ web frontend, dùng cho link đặt lại mật khẩu
  frontend-base-url: ${APP_FRONTEND_BASE_URL:http://localhost:5173}
  cors:
    # Danh sách origin được gọi API, phân tách bằng dấu phẩy
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ROOT_USER:minioadmin}
  secret-key: ${MINIO_ROOT_PASSWORD}
  bucket:
    faces: face-profiles
    evidence: security-evidence

icss:
  scheduler:
    expire-overdue-cron: ${EXPIRE_OVERDUE_CRON:0 */15 * * * *}
    # D-2.1: đơn APPROVED đã qua giờ kết thúc -> FINISHED do hệ thống
    finish-elapsed-cron: ${FINISH_ELAPSED_CRON:0 */15 * * * *}
    notification-expiring-soon-cron: ${NOTIFICATION_EXPIRING_SOON_CRON:0 */10 * * * *}
    notification-pending-overdue-cron: ${NOTIFICATION_PENDING_OVERDUE_CRON:0 0 * * * *}
    event-mode-tick-cron: ${EVENT_MODE_TICK_CRON:0 */1 * * * *}
    guest-visit-tick-cron: ${GUEST_VISIT_TICK_CRON:0 */1 * * * *}
    # Dọn nhật ký ra vào tại camera (số ngày giữ: ENTRY_LOG_RETENTION_DAYS trong system_configurations)
    access-log-retention-cron: ${ACCESS_LOG_RETENTION_CRON:0 30 2 * * *}
    # Job leo thang sự cố: chu kỳ đọc từ INCIDENT_ESCALATION_CHECK_SECONDS (system_configurations), cờ này chỉ bật/tắt job
    incident-escalation-enabled: ${INCIDENT_ESCALATION_ENABLED:true}
  guest:
    # Giới hạn kích thước ảnh khách (KB), tham số vận hành
    photo-max-kb: ${GUEST_PHOTO_MAX_KB:2048}
  internal:
    # Khoá dùng chung AI service ↔ backend (header X-Service-Key) cho check-entry và /api/internal/**.
    # Bắt buộc, tối thiểu 32 ký tự: thiếu thì backend không khởi động. Giá trị chỉ đặt trong .env, không commit.
    service-key: ${INTERNAL_SERVICE_KEY:}

recording:
  storage:
    path: ${RECORDING_STORAGE_PATH:C:/DATN/AI-Based-Intelligent-Campus-Security-Surveillance-System/recording}
  evidence:
    path: ${EVIDENCE_STORAGE_PATH:C:/DATN/AI-Based-Intelligent-Campus-Security-Surveillance-System/evidence}


