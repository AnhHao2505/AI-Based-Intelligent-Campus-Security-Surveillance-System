spring:
  application:
    name: campus-security-backend
  jackson:
    time-zone: Asia/Ho_Chi_Minh
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:campus_security}?options=-c%20timezone=Asia/Ho_Chi_Minh
    username: ${POSTGRES_USER:sep}
    password: ${POSTGRES_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false # Tránh LazyInitializationException bị che giấu / query N+1 không kiểm soát
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# Actuator — health check, Phase 1 Definition of Done: GET /actuator/health -> 200 OK
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:9a4f2c8d3b7a1e5f8g2h6i0j3k7l1m5n9o3p7q1r5s9t3u7v1w5x9y3z7a1b5c9d}
    expiration-ms: ${JWT_EXPIRATION:86400000} # 24 hours
  google:
    client-id: ${GOOGLE_CLIENT_ID}