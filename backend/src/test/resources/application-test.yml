spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/campus_security_test?options=-c%20timezone=Asia/Ho_Chi_Minh
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    clean-disabled: false
    clean-on-validation-error: true
    out-of-order: true
    locations: classpath:db/migration
