spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/campus_security_test?options=-c%20timezone=Asia/Ho_Chi_Minh
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    clean-disabled: false
    clean-on-validation-error: true
    out-of-order: true
    locations: classpath:db/migration

# Tắt mọi tick chạy theo lịch trong test: test gọi thẳng method job với now truyền vào.
# Tick thật chạy nền trên DB test dùng chung gây flaky (thông báo lạ gửi tới user của test đang chạy).
# GuardTeamDispatchService có cron viết cứng (0 0 0 * * ?), không tắt được bằng cấu hình.
icss:
  scheduler:
    event-mode-tick-cron: "-"
    expire-overdue-cron: "-"
    notification-expiring-soon-cron: "-"
    notification-pending-overdue-cron: "-"
    rate-limiter-cleanup-cron: "-"
    # Job lượt khách (GuestVisitJobService)
    guest-visit-tick-cron: "-"
