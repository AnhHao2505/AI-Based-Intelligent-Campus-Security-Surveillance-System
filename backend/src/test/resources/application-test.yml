spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/campus_security_test?options=-c%20timezone=Asia/Ho_Chi_Minh
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    clean-disabled: false
    clean-on-validation-error: true
    out-of-order: true
    locations: classpath:db/migration

# Tắt mọi tick chạy theo lịch trong test: test gọi thẳng method job với now truyền vào.
# Tick thật chạy nền trên DB test dùng chung gây flaky (thông báo lạ gửi tới user của test đang chạy).
# GuardTeamDispatchService có cron viết cứng (0 0 0 * * ?), không tắt được bằng cấu hình.
icss:
  scheduler:
    event-mode-tick-cron: "-"
    expire-overdue-cron: "-"
    notification-expiring-soon-cron: "-"
    notification-pending-overdue-cron: "-"
    rate-limiter-cleanup-cron: "-"
    # Job lượt khách (GuestVisitJobService)
    guest-visit-tick-cron: "-"
    # Job dọn nhật ký ra vào (AccessLogRetentionService)
    access-log-retention-cron: "-"
    # Job leo thang sự cố (IncidentEscalationJob, Trigger động nên không tắt bằng cron "-")
    incident-escalation-enabled: false
  internal:
    # Khoá giả chỉ dùng cho test (>= 32 ký tự), không phải khoá thật
    service-key: test-only-internal-service-key-0123456789

app:
  jwt:
    secret: test-only-jwt-62e0fdf877032ac0cf424858761bd9b5083d9097282d4a5525786d4ecde99040 # test-only, not a real secret

minio:
  secret-key: test-only-minio-88babfda7721fbeb40a6dff0bf28705c # test-only, not a real secret
