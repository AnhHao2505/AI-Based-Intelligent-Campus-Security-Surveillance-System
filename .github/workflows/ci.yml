name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: backend-test
    runs-on: ubuntu-latest
    timeout-minutes: 40

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          # DB tạm chỉ sống trong job này, không phải mật khẩu thật.
          POSTGRES_USER: sep
          POSTGRES_PASSWORD: ci_only_temp_pw
          POSTGRES_DB: campus_security_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sep -d campus_security_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      POSTGRES_USER: sep
      POSTGRES_PASSWORD: ci_only_temp_pw
      # Cùng múi giờ với máy dev và DB.
      TZ: Asia/Ho_Chi_Minh

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        run: ./mvnw -B test

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports
          if-no-files-found: ignore
          retention-days: 7

  frontend-check:
    name: frontend-check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
