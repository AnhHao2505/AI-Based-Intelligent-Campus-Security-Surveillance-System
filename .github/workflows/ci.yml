name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: backend-test
    runs-on: ubuntu-latest
    timeout-minutes: 40

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          # DB tạm chỉ sống trong job này, không phải mật khẩu thật.
          POSTGRES_USER: sep
          POSTGRES_PASSWORD: ci_only_temp_pw
          POSTGRES_DB: campus_security_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sep -d campus_security_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      POSTGRES_USER: sep
      POSTGRES_PASSWORD: ci_only_temp_pw
      # Cùng múi giờ với máy dev và DB.
      TZ: Asia/Ho_Chi_Minh

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        run: ./mvnw -B test

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports
          if-no-files-found: ignore
          retention-days: 7

  frontend-check:
    name: frontend-check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  ai-service-test:
    name: ai-service-test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Khoá giả chỉ dùng trong test (config yêu cầu >= 32 ký tự), không phải khoá thật.
      INTERNAL_SERVICE_KEY: ci-only-fake-internal-service-key-0123456789
      # Cùng múi giờ với máy dev và backend-test (luật ban đêm xét theo giờ địa phương).
      TZ: Asia/Ho_Chi_Minh

    defaults:
      run:
        working-directory: ai-service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Cùng bản Python với ai-service/Dockerfile (python:3.11-slim).
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt

      - name: Install system libraries
        # libpq-dev: build psycopg2 (bản không -binary); libgl1/libglib2.0-0: OpenCV, giống Dockerfile.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpq-dev libgl1 libglib2.0-0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Torch bản CPU: tránh kéo ~2.5 GB thư viện CUDA mà runner không dùng.
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt pytest

      - name: Run tests
        # requires_model: test nạp model thật yolo26n.pt / w600k_r50.onnx (bị .gitignore, CI không có).
        # Lý do + danh sách: ai-service/tests/conftest.py.
        run: python -m pytest tests -m "not requires_model" -p no:cacheprovider -q -rfE

  mobile-test:
    name: mobile-test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Cùng bản Flutter với máy dev (flutter --version).
          flutter-version: "3.44.6"
          cache: true

      - run: flutter pub get
      - run: flutter test
