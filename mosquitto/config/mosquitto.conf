# Listener 1883: MQTT TCP tiêu chuẩn (chỉ expose 127.0.0.1 trên Host qua docker-compose)
listener 1883 0.0.0.0
allow_anonymous false
password_file /mosquitto/auth/passwd
acl_file /mosquitto/auth/acl
max_queued_messages 10000
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
# Ghi chú: Listener 8883 (MQTTS TLS) và Listener 8884 (WSS) được init.sh nạp tự động khi có chứng chỉ mount vào /mosquitto/certs/
