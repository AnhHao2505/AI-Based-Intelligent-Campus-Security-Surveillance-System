###############################################
# MediaMTX Configuration for FPTU Campus Security #
###############################################

# Cấu hình chung
logLevel: info
logDestinations: [stdout]

# 1. RTSP Server (Cổng 8554 cho AI Service kéo luồng)
rtsp: yes
rtspTransports: [tcp, udp]
rtspAddress: :8554

# 2. WebRTC Server (Cổng 8889 - WHEP cho Trình duyệt Web)
webrtc: yes
webrtcAddress: :8889
webrtcAllowOrigins: ['*']
webrtcLocalUDPAddress: :8189
webrtcAdditionalHosts: ['127.0.0.1']

# 3. Playback Server (Cổng 9996 — chỉ phục vụ nội bộ qua Backend ICSS, bắt buộc Basic Auth icss-internal)
playback: yes
playbackAddress: :9996

# 4. Cấu hình định dạng ghi hình fMP4 mặc định cho YouTube-Live DVR Playback (an toàn khi mất điện, không mất moov atom)
pathDefaults:
  record: yes
  recordPath: /recordings/%path/%Y-%m-%d_%H-%M-%S-%f
  recordFormat: fmp4
  recordPartDuration: 1s
  recordSegmentDuration: 1m
  recordDeleteAfter: 72h

# 5. API Quản trị (Cổng 9997 — xác thực qua authHTTPAddress Basic Auth icss-internal)
api: yes
apiAddress: :9997

# 5.1 Xác thực toàn diện (WHEP WebRTC, RTSP read/publish nội bộ, và Control API) qua Backend ICSS
# Giá trị authHTTPAddress mặc định dưới đây có thể được ghi đè động bằng biến môi trường
# MTX_AUTHHTTPADDRESS (ví dụ cấu hình trong docker-compose.yml hoặc qua file .env với MEDIAMTX_AUTH_HTTP_ADDRESS).
# - Chạy MediaMTX nhị phân trên Windows host: trỏ tới http://127.0.0.1:8080/api/cameras/whep-auth
# - Chạy MediaMTX trong Docker Desktop (Windows/Mac): trỏ tới http://host.docker.internal:8080/api/cameras/whep-auth
# - Chạy MediaMTX trong mạng Docker Linux: trỏ tới http://backend:8080/api/cameras/whep-auth
authMethod: http
authHTTPAddress: http://host.docker.internal:8080/api/cameras/whep-auth

# 6. Danh sách Kênh Camera
# Tất cả các camera sẽ được Edge AI Agent / Backend tự động đồng bộ qua MediaMTX API (/v3/config/paths/add)
paths:
  all_others:
    source: publisher
