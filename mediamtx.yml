###############################################
# MediaMTX Configuration for FPTU Campus Security #
###############################################

# Cấu hình chung
logLevel: info
logDestinations: [stdout]

# 1. RTSP Server (Cổng 8554 cho AI Service kéo luồng)
rtsp: yes
rtspTransports: [tcp, udp]
rtspAddress: :8554

# 2. WebRTC Server (Cổng 8889 - WHEP cho Trình duyệt Web)
webrtc: yes
webrtcAddress: :8889
webrtcAllowOrigins: ['*']
webrtcLocalUDPAddress: :8189
webrtcAdditionalHosts: ['127.0.0.1']

# 3. Playback Server (Cổng 9996 - hỗ trợ truy xuất fMP4 segment chuẩn công nghiệp)
playback: yes
playbackAddress: :9996
playbackAllowOrigins: ['*']

# 4. Cấu hình định dạng ghi hình fMP4 mặc định (an toàn khi mất điện, không mất moov atom)
pathDefaults:
  recordFormat: fmp4
  recordPartDuration: 1s
  recordSegmentDuration: 1m
  recordDeleteAfter: 72h

# 5. API Quản trị (Cổng 9997)
api: yes
apiAddress: :9997

authMethod: internal
authInternalUsers:
  - user: any
    pass: ''
    permissions:
      - action: api
      - action: read
      - action: publish
      - action: playback

# 6. Danh sách Kênh Camera
# Tất cả các camera sẽ được Edge AI Agent / Backend tự động đồng bộ qua MediaMTX API (/v3/config/paths/add)
paths:
  all_others:
    source: publisher
