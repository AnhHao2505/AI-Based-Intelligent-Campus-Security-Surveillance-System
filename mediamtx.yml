###############################################
# MediaMTX Configuration for FPTU Campus Security #
###############################################

# Cấu hình chung
logLevel: info
logDestinations: [stdout]

# 1. RTSP Server (Cổng 8554 cho AI Service kéo luồng)
rtsp: yes
rtspTransports: [tcp, udp]
rtspAddress: :8554

# 2. WebRTC Server (Cổng 8889 - WHEP cho Trình duyệt Web)
webrtc: yes
webrtcAddress: :8889
webrtcAllowOrigins: ['*']
webrtcLocalUDPAddress: :8189

# 3. API Quản trị (Cổng 9997)
api: yes
apiAddress: :9997

authMethod: internal
authInternalUsers:
  - user: any
    pass: ''
    permissions:
      - action: api
      - action: read
      - action: publish

# 4. Danh sách Kênh Camera
# Tất cả các camera sẽ được Backend tự động đồng bộ qua MediaMTX API (/v3/config/paths/add)
paths:
  # Cho phép các nguồn khác kết nối hoặc đẩy luồng vào MediaMTX
  all_others:
    source: publisher
